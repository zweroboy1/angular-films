<nav class="breadcrumbs">
  <div class="breadcrumbs__inner">
    @for (crumb of breadcrumbsService.breadcrumbs(); track crumb.label; let last = $last) {
      @if (!last && crumb.url) {
        <a class="breadcrumbs__link" [routerLink]="crumb.url">{{ crumb.label }}</a>
        <span class="breadcrumbs__separator">›</span>
      } @else {
        <span class="breadcrumbs__current">{{ crumb.label }}</span>
      }
    }
  </div>
</nav>
